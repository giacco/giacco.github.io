name: Update npm lockfile

on:
  push:
    branches: [feat/react-router-pages]

permissions:
  contents: write

jobs:
  update-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[skip lockfile]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/react-router-pages

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update npm lockfile [skip lockfile]"
          git push origin HEAD:feat/react-router-pages
