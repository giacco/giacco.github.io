<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050805" />
    <title>Portfolio offline</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #030603; color: #d7ffe5; }
      main { width: min(680px, calc(100% - 32px)); padding: 32px; border: 1px solid rgba(0,255,102,.35); border-radius: 16px; background: rgba(0,0,0,.35); }
      h1 { margin-top: 0; color: #00ff66; }
      p { line-height: 1.7; color: #9ccbaa; }
      code { color: #73ffab; }
    </style>
  </head>
  <body>
    <main>
      <h1>Portfolio offline</h1>
      <p>The app is not reachable right now. Reconnect and reload to continue.</p>
      <p><code>status: network_unavailable</code></p>
    </main>
  </body>
</html>
